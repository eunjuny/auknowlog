name: Container smoke verification

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - "docker-compose.app.yml"
      - "docker-compose.auth.yml"
      - "docker-compose.app-auth.yml"
      - "docker-compose.smoke.yml"
      - "docker-compose.auth-smoke.yml"
      - "ops/keycloak/**"
      - "scripts/verify-compose-app.sh"
      - "scripts/setup-osc-sample-accounts.mjs"
      - "scripts/verify-osc-samples.mjs"
      - "scripts/run-compose-auth-smoke.mjs"
      - ".github/workflows/container-smoke.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - "docker-compose.app.yml"
      - "docker-compose.auth.yml"
      - "docker-compose.app-auth.yml"
      - "docker-compose.smoke.yml"
      - "docker-compose.auth-smoke.yml"
      - "ops/keycloak/**"
      - "scripts/verify-compose-app.sh"
      - "scripts/setup-osc-sample-accounts.mjs"
      - "scripts/verify-osc-samples.mjs"
      - "scripts/run-compose-auth-smoke.mjs"
      - ".github/workflows/container-smoke.yml"

permissions:
  contents: read

jobs:
  app-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUKNOWLOG_DAILY_LEARNING_ENABLED: "false"
      AUKNOWLOG_LEARNING_MAIL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v6
      - name: Build and start the local stack
        run: docker compose -f docker-compose.yml -f docker-compose.app.yml up --build -d --wait
      - name: Check HTTP contract
        run: bash scripts/verify-compose-app.sh
      - name: Show container state on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.app.yml ps
      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.app.yml down -v

  auth-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser verification dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify real container OIDC login and ownership
        run: node scripts/run-compose-auth-smoke.mjs
