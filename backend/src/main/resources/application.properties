# OpenAI와 Langfuse credentials can be supplied through environment variables or a separate
# application-api.properties file (not committed to Git).
spring.config.import=optional:file:./application-api.properties

auknowlog.openai.api.key=${OPENAI_API_KEY:}
auknowlog.openai.api.url=https://api.openai.com/v1/responses
auknowlog.openai.model=gpt-5.4-mini
auknowlog.openai.reasoning-effort=low
auknowlog.openai.embedding.enabled=${AUKNOWLOG_EMBEDDINGS_ENABLED:true}
auknowlog.openai.embedding.api-url=https://api.openai.com/v1/embeddings
auknowlog.openai.embedding.model=text-embedding-3-small
auknowlog.openai.embedding.dimensions=512

# 학습 자료 수집은 AI를 호출하지 않는다. 파일과 URL 응답의 크기·시간을 제한한다.
auknowlog.source.max-content-characters=50000
auknowlog.source.file.max-bytes=10485760
auknowlog.source.url.max-bytes=5242880
auknowlog.source.url.connect-timeout=3s
auknowlog.source.url.request-timeout=8s
auknowlog.source.url.max-redirects=3
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Langfuse는 OpenTelemetry(OTLP) 기반의 선택 기능이다. 기본 비활성이므로 API 키가 없어도
# 외부 통신·추가 비용 없이 퀴즈 생성은 그대로 동작한다.
auknowlog.langfuse.enabled=${LANGFUSE_ENABLED:false}
auknowlog.langfuse.public-key=${LANGFUSE_PUBLIC_KEY:}
auknowlog.langfuse.secret-key=${LANGFUSE_SECRET_KEY:}
auknowlog.langfuse.base-url=${LANGFUSE_BASE_URL:https://cloud.langfuse.com}
auknowlog.langfuse.environment=${LANGFUSE_ENVIRONMENT:development}
auknowlog.langfuse.capture-content=${LANGFUSE_CAPTURE_CONTENT:false}
spring.application.name=auknowlog

# Virtual Threads 활성화 (Java 21)
spring.threads.virtual.enabled=true

# PostgreSQL 설정
spring.datasource.url=jdbc:postgresql://localhost:5432/auknowlog
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:auknowlog}
spring.datasource.password=${POSTGRES_PASSWORD:auknowlog123}

# JPA 설정
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway는 새 데이터베이스의 스키마를 만들고, 기존 개발 DB는 baseline 이후의 변경만 적용합니다.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# 운영 관측: /actuator/metrics는 진단용이고, Prometheus는 /actuator/prometheus를 수집합니다.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.auknowlog.ai.request.duration=true
management.metrics.distribution.percentiles-histogram.auknowlog.quiz.generation.duration=true
management.metrics.distribution.slo.auknowlog.ai.request.duration=1s,3s,5s,10s,20s,30s
management.metrics.distribution.slo.auknowlog.quiz.generation.duration=1s,3s,5s,10s,20s,30s
