# 기존 docker-compose.yml의 PostgreSQL과 함께 사용하는 선택형 애플리케이션 구성.
# 기본값은 외부 AI/메일 호출이 없는 로컬 단일 사용자 모드다.
services:
  backend:
    image: auknowlog-backend:local
    build:
      context: ./backend
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auknowlog
      POSTGRES_USER: auknowlog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auknowlog123}
      AUKNOWLOG_DAILY_LEARNING_ENABLED: ${AUKNOWLOG_CONTAINER_DAILY_LEARNING_ENABLED:-false}
      AUKNOWLOG_LEARNING_MAIL_ENABLED: ${AUKNOWLOG_CONTAINER_LEARNING_MAIL_ENABLED:-false}
      AUKNOWLOG_EMBEDDINGS_ENABLED: ${AUKNOWLOG_CONTAINER_EMBEDDINGS_ENABLED:-false}
      OPENAI_API_KEY: ${AUKNOWLOG_CONTAINER_OPENAI_API_KEY:-}
      AUKNOWLOG_NOTION_API_KEY: ${AUKNOWLOG_CONTAINER_NOTION_API_KEY:-}
      AUKNOWLOG_MAIL_USERNAME: ${AUKNOWLOG_CONTAINER_MAIL_USERNAME:-}
      AUKNOWLOG_MAIL_APP_PASSWORD: ${AUKNOWLOG_CONTAINER_MAIL_APP_PASSWORD:-}
      AUKNOWLOG_MAIL_RECIPIENT: ${AUKNOWLOG_CONTAINER_MAIL_RECIPIENT:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    image: auknowlog-frontend:local
    build:
      context: ./frontend
      args:
        VITE_AUTH_ENABLED: ${VITE_AUTH_ENABLED:-false}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://127.0.0.1:8180}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
