services:
  # pgvector를 포함한 PostgreSQL: 원본 데이터와 의미 검색 벡터를 함께 관리합니다.
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    container_name: auknowlog-postgres
    environment:
      POSTGRES_DB: auknowlog
      POSTGRES_USER: auknowlog
      POSTGRES_PASSWORD: auknowlog123
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auknowlog -d auknowlog"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 필요할 때만 실행하는 로컬 관측 스택입니다.
  # 호스트에서 실행 중인 Spring Boot의 /actuator/prometheus를 15초마다 수집합니다.
  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: auknowlog-prometheus
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # 로컬 포트폴리오 관측에서도 월간 추세를 비교할 수 있도록 60일간 보관합니다.
      - "--storage.tsdb.retention.time=60d"
      - "--web.enable-lifecycle"
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
